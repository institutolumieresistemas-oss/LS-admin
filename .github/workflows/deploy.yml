name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build Angular & Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 1. Compilar y empaquetar PRODUCCIÓN
      - name: Build Producción
        run: npm run build:prod

      - name: Package Producción dist
        run: tar -czf dist_prod.tar.gz -C dist/pedidos/browser .

      # 2. Compilar y empaquetar PRUEBAS
      - name: Build Pruebas
        run: npx ng build -c pruebas

      - name: Package Pruebas dist
        run: tar -czf dist_pruebas.tar.gz -C dist/pedidos/browser .

      # 3. Subir ambos paquetes al servidor
      - name: Upload archives to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          source: "dist_prod.tar.gz,dist_pruebas.tar.gz"
          target: "~/"

      # 4. Desplegar en el servidor
      - name: Deploy Producción en servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          script: |
            echo "🚀 Desplegando en PRODUCCIÓN (admin)..."
            rm -rf ${{ secrets.SSH_TARGET_ADMIN }}/*
            tar -xzf ~/dist_prod.tar.gz -C ${{ secrets.SSH_TARGET_ADMIN }}
            rm ~/dist_prod.tar.gz
            echo "✅ Deploy PRODUCCIÓN completado"

      - name: Deploy Pruebas en servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          script: |
            echo "🚀 Desplegando en PRUEBAS (pruebas)..."
            rm -rf ${{ secrets.SSH_TARGET_ADMIN_DEV }}/*
            tar -xzf ~/dist_pruebas.tar.gz -C ${{ secrets.SSH_TARGET_ADMIN_DEV }}
            rm ~/dist_pruebas.tar.gz
            echo "✅ Deploy PRUEBAS completado"
