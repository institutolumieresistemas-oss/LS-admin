<div class="modal-header bg-lumiere text-white py-2 d-flex justify-content-between align-items-center">
    <h5 class="modal-title text-white mb-0 fs-6">
        <i class="fas fa-receipt me-2"></i>{{ titulo }}
    </h5>
    <div>
        <button type="button" class="btn btn-sm btn-outline-light me-1" (click)="abrirEnNuevaPestana()" title="Abrir en pestaña nueva" *ngIf="voucherProcesado">
            <i class="fas fa-external-link-alt me-1"></i> Abrir / Descargar
        </button>
        <button type="button" class="btn btn-sm btn-outline-light me-2" (click)="rotarImagen()" title="Rotar Imagen" *ngIf="esImagen && voucherProcesado">
            <i class="fas fa-redo me-1"></i> Rotar
        </button>
        <button type="button" class="btn-close btn-close-white" (click)="cerrar()"></button>
    </div>
</div>

<div class="modal-body p-3 text-center bg-dark bg-opacity-10 min-h-300 d-flex flex-column justify-content-center align-items-center">
    <!-- MENSAJE SI NO HAY VOUCHER -->
    <div *ngIf="!voucherProcesado" class="alert alert-warning my-4 w-100">
        <i class="fas fa-exclamation-triangle fa-2x d-block mb-2 text-warning"></i>
        <strong>No se encontró ningún voucher o comprobante adjunto para este registro.</strong>
    </div>

    <!-- IMAGEN -->
    <div *ngIf="esImagen && voucherProcesado" class="w-100 overflow-auto py-2 text-center">
        <img [src]="voucherProcesado" 
             alt="Voucher" 
             class="img-fluid rounded shadow-sm voucher-img" 
             [style.transform]="'rotate(' + rotacion + 'deg)'">
    </div>

    <!-- PDF -->
    <div *ngIf="esPdf && pdfSafeUrl" class="w-100">
        <iframe [src]="pdfSafeUrl" class="w-100 pdf-viewer rounded shadow-sm"></iframe>
    </div>
</div>

<div class="modal-footer py-2">
    <button type="button" class="btn btn-secondary btn-sm" (click)="cerrar()">Cerrar</button>
</div>
